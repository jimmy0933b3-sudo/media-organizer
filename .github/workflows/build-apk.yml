name: Build signed APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

# Prevent older builds from publishing after newer master commits.
concurrency:
  group: media-organizer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:

      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"

      - name: Run similarity tests
        run: |
          mkdir -p dist
          set -o pipefail && bash tests/run-tests.sh | tee dist/test-results.txt

      - name: Load Android signing key from Actions Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required Actions signing secret: $name"
              exit 1
            fi
          done
          umask 077
          signing_file="$RUNNER_TEMP/media-organizer-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$signing_file"
          test -s "$signing_file"
          keytool -list -keystore "$signing_file" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > /dev/null
          echo "ANDROID_KEYSTORE_FILE=$signing_file" >> "$GITHUB_ENV"

      - name: Build signed Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          gradle --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2g -PrequireReleaseSigning :app:assembleRelease

      - name: Copy Release APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk dist/Media-Organizer.apk

      - name: Verify signature, metadata, model, and native libraries
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            dist/Media-Organizer.apk > dist/apk-signature.txt
          # Check that the installed APK really uses the Actions certificate.
          expected_sha="$(keytool -exportcert -keystore "$ANDROID_KEYSTORE_FILE" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | sha256sum | awk '{print $1}')"
          actual_sha="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' dist/apk-signature.txt | head -n 1)"
          if [[ -z "$actual_sha" || "$expected_sha" != "$actual_sha" ]]; then
            echo "::error::APK signer does not match Actions keystore"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
            dist/Media-Organizer.apk > dist/apk-metadata.txt
          (cd dist && sha256sum Media-Organizer.apk > Media-Organizer.apk.sha256)
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import zipfile

          metadata = Path("dist/apk-metadata.txt").read_text()
          assert "name='tw.mediaorganizer'" in metadata, metadata
          assert "sdkVersion:'30'" in metadata, metadata
          assert "targetSdkVersion:'35'" in metadata, metadata
          expected_model = Path("app/src/main/assets/mobilefacenet.tflite").read_bytes()
          with zipfile.ZipFile("dist/Media-Organizer.apk") as apk:
              model = apk.read("assets/mobilefacenet.tflite")
              assert model == expected_model, "APK model differs from source"
              packaged_abis = {p.split("/")[1] for p in apk.namelist()
                               if p.startswith("lib/") and p.endswith(".so")}
              required_abis = {"arm64-v8a", "armeabi-v7a", "x86", "x86_64"}
              assert required_abis <= packaged_abis, packaged_abis
          run_url = ("https://github.com/" + os.environ["GITHUB_REPOSITORY"]
                     + "/actions/runs/" + os.environ["GITHUB_RUN_ID"])
          Path("dist/build-info.txt").write_text(
              "Source commit: " + os.environ["GITHUB_SHA"] + "\n"
              + "Build run: " + run_url + "\n"
              + "Model SHA-256: " + hashlib.sha256(model).hexdigest() + "\n"
              + "Native libraries: " + ", ".join(sorted(packaged_abis)) + "\n"
              + "Scope: logic tests and APK packaging.\n")
          print("PASS APK package, SDK levels, model, and four native ABIs")
          PY

      - name: Upload APK and verification results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Media-Organizer-APK
          path: dist/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  smoke_test:
    needs: build
    runs-on: ubuntu-24.04
    # Android emulator startup and repeated cold launches can exceed 20 minutes.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 35]
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: Media-Organizer-APK
          path: dist/

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -al /dev/kvm || true
          grep -cw vmx /proc/cpuinfo || true

      - name: Run Emulator Smoke Test
        uses: reactivecircus/android-emulator-runner@9b78b339fcface67c267bcf3f3af3fd5430c6401
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tests/emulator-smoke.sh ${{ matrix.api-level }}

      - name: Upload Diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Diagnostics-API${{ matrix.api-level }}
          path: dist/diagnostics/
          retention-days: 10
          compression-level: 0

  publish:
    needs: [build, smoke_test]
    if: ${{ success() && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified APK
        uses: actions/download-artifact@v4
        with:
          name: Media-Organizer-APK
          path: dist/

      - name: Publish latest signed APK and remove older Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Avoid publishing obsolete commits after master has moved forward.
          master_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq '.sha')"
          if [[ "$master_sha" != "$GITHUB_SHA" ]]; then
            echo "Master advanced to $master_sha; skipping this outdated release."
            exit 0
          fi

          version="$(sed -nE "s/.*versionName='([^']+)'.*/\1/p" dist/apk-metadata.txt | head -n 1)"
          test -n "$version"
          tag="media-organizer-ci-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          # One new immutable-by-tag source snapshot for each successful master build.
          gh release create "$tag" \
            dist/Media-Organizer.apk \
            dist/Media-Organizer.apk.sha256 \
            dist/apk-signature.txt \
            dist/apk-metadata.txt \
            dist/build-info.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Media Organizer v${version} (CI #${GITHUB_RUN_NUMBER})" \
            --notes-file dist/build-info.txt \
            --latest

          # Never purge the existing release unless the new APK was published.
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | grep -Fxq 'Media-Organizer.apk'

          # This repository intentionally retains exactly one GitHub Release.
          # Preserve historical non-CI tags but remove tags created by this CI.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[].tag_name' |
            while IFS= read -r old_tag; do
              [[ -n "$old_tag" && "$old_tag" != "$tag" ]] || continue
              if [[ "$old_tag" == media-organizer-ci-* || "$old_tag" == latest-build ]]; then
                gh release delete "$old_tag" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY"
              else
                gh release delete "$old_tag" --yes --repo "$GITHUB_REPOSITORY"
              fi
            done
          echo "Latest release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
